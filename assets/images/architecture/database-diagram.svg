<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#0f172a}.tbl{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.head{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;rx:8}</style>
<text x="600" y="38" text-anchor="middle" font-size="25" font-weight="bold">GigMap - Relational Database Diagram</text>
<g transform="translate(40 80)"><rect class="head" width="220" height="45"/><text x="110" y="29" text-anchor="middle" font-size="18" font-weight="bold">USER</text><rect class="tbl" y="45" width="220" height="105"/><text x="15" y="72" font-size="14">PK user_id</text><text x="15" y="96" font-size="14">UK email</text><text x="15" y="120" font-size="14">role</text><text x="15" y="144" font-size="14">location_consent</text></g>
<g transform="translate(330 80)"><rect class="head" width="220" height="45"/><text x="110" y="29" text-anchor="middle" font-size="18" font-weight="bold">CONCERT</text><rect class="tbl" y="45" width="220" height="130"/><text x="15" y="72" font-size="14">PK concert_id</text><text x="15" y="96" font-size="14">FK artist_id</text><text x="15" y="120" font-size="14">title, genre</text><text x="15" y="144" font-size="14">start_at, status</text><text x="15" y="168" font-size="14">latitude, longitude</text></g>
<g transform="translate(620 80)"><rect class="head" width="220" height="45"/><text x="110" y="29" text-anchor="middle" font-size="18" font-weight="bold">ATTENDANCE</text><rect class="tbl" y="45" width="220" height="105"/><text x="15" y="72" font-size="14">PK attendance_id</text><text x="15" y="96" font-size="14">FK user_id</text><text x="15" y="120" font-size="14">FK concert_id</text><text x="15" y="144" font-size="14">status</text></g>
<g transform="translate(910 80)"><rect class="head" width="220" height="45"/><text x="110" y="29" text-anchor="middle" font-size="18" font-weight="bold">ARTIST_PROFILE</text><rect class="tbl" y="45" width="220" height="105"/><text x="15" y="72" font-size="14">PK artist_id</text><text x="15" y="96" font-size="14">FK user_id</text><text x="15" y="120" font-size="14">stage_name</text><text x="15" y="144" font-size="14">photo_url</text></g>
<g transform="translate(170 350)"><rect class="head" width="240" height="45"/><text x="120" y="29" text-anchor="middle" font-size="18" font-weight="bold">COMMUNITY</text><rect class="tbl" y="45" width="240" height="105"/><text x="15" y="72" font-size="14">PK community_id</text><text x="15" y="96" font-size="14">FK owner_id</text><text x="15" y="120" font-size="14">name</text><text x="15" y="144" font-size="14">description</text></g>
<g transform="translate(480 350)"><rect class="head" width="240" height="45"/><text x="120" y="29" text-anchor="middle" font-size="18" font-weight="bold">MEMBERSHIP</text><rect class="tbl" y="45" width="240" height="105"/><text x="15" y="72" font-size="14">PK membership_id</text><text x="15" y="96" font-size="14">FK user_id</text><text x="15" y="120" font-size="14">FK community_id</text><text x="15" y="144" font-size="14">joined_at</text></g>
<g transform="translate(790 350)"><rect class="head" width="240" height="45"/><text x="120" y="29" text-anchor="middle" font-size="18" font-weight="bold">POST</text><rect class="tbl" y="45" width="240" height="105"/><text x="15" y="72" font-size="14">PK post_id</text><text x="15" y="96" font-size="14">FK community_id</text><text x="15" y="120" font-size="14">FK author_id</text><text x="15" y="144" font-size="14">content, image_url</text></g>
<text x="600" y="595" text-anchor="middle" font-size="15">FK = foreign key | PK = primary key | UK = unique key</text>
</svg>